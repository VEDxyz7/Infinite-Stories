name: Offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q
      - run: ruff check backend scripts/verify_qloo_tooling.py scripts/check_release.py scripts/export_contracts.py scripts/service_smoke.py scripts/check_environment.py scripts/openai_connectivity.py scripts/verify_postgres.py
      - run: ruff format --check backend scripts/verify_qloo_tooling.py scripts/check_release.py scripts/export_contracts.py scripts/service_smoke.py scripts/check_environment.py scripts/openai_connectivity.py scripts/verify_postgres.py
      - name: Verify the model connectivity command stays offline by default
        run: python -m scripts.openai_connectivity
      - run: python -m scripts.export_contracts --check
      - run: pip check
      - run: pip-audit -r backend/requirements.txt --disable-pip --no-deps --progress-spinner off
      - name: Record blocked release gates (not a release approval)
        run: python scripts/check_release.py --report-only
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stories
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: infinite_stories
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stories -d infinite_stories"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Exercise real PostgreSQL (CI service only, never production data)
        env:
          IS_TEST_POSTGRES_URL: postgresql+psycopg://stories:ephemeral-ci-only@127.0.0.1:5432/infinite_stories
        run: python -m pytest backend/tests/test_postgres.py -q
